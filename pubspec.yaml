name: tiertask
description: "Task manager for Linux, Android, and Windows using a tiered pull-system and a single local or WebDAV-synchronized Markdown file."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo/tiertask_logo.png
    - assets/logo/tiertask_logo.svg
