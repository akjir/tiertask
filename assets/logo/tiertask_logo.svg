<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D256C"/>
      <stop offset="100%" stop-color="#071A52"/>
    </linearGradient>
    <linearGradient id="tierFocusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00BFA5"/>
    </linearGradient>
    <linearGradient id="tierReadyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#009688"/>
    </linearGradient>
    <linearGradient id="tierPlannedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00796B"/>
      <stop offset="100%" stop-color="#004D40"/>
    </linearGradient>
    <linearGradient id="checkBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#009688"/>
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" ry="109" fill="none" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="6"/>

  <!-- Stacked tier bars (Focus, Ready, Planned) -->
  <rect x="96" y="116" width="320" height="56" rx="28" ry="28" fill="url(#tierFocusGrad)"/>
  <rect x="96" y="204" width="248" height="56" rx="28" ry="28" fill="url(#tierReadyGrad)"/>
  <rect x="96" y="292" width="176" height="56" rx="28" ry="28" fill="url(#tierPlannedGrad)"/>

  <!-- Completion checkmark badge -->
  <circle cx="348" cy="332" r="98" fill="#071A52"/>
  <circle cx="348" cy="332" r="82" fill="url(#checkBadgeGrad)"/>
  <path d="M 308 334 L 336 362 L 392 302" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
